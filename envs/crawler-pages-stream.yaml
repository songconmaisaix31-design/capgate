id: crawler-pages-stream
domain: 数据采集
tags: [多页流式]
prior: 3.0
stream: true
capabilities:
  - id: mcp-fetch
    kind: mcp
    version: ">=0.1,<0.2"
    # 上下游各用独立连接：多页抓取与分析都走 mcp-fetch 时不能共享同一 stdio 进程。
    shared: false
agent:
  adapter: scripted
  models: [rule-v1]
  recipe:
    - { capability: mcp-fetch, tool: fetch_url, args: { url: "{{ input.urls.0 }}" }, as: p0 }
    - stream_emit:
        name: crawl_pages
        body:
          page_0: { url: "{{ p0.url }}", title: "{{ p0.title }}", links: "{{ p0.links }}", text: "{{ p0.text }}" }
    - { capability: mcp-fetch, tool: fetch_url, args: { url: "{{ input.urls.1 }}" }, as: p1 }
    - stream_emit:
        name: crawl_pages
        body:
          page_1: { url: "{{ p1.url }}", title: "{{ p1.title }}", links: "{{ p1.links }}", text: "{{ p1.text }}" }
    - { capability: mcp-fetch, tool: fetch_url, args: { url: "{{ input.urls.2 }}" }, as: p2 }
    - stream_emit:
        name: crawl_pages
        body:
          page_2: { url: "{{ p2.url }}", title: "{{ p2.title }}", links: "{{ p2.links }}", text: "{{ p2.text }}" }
    - { capability: mcp-fetch, tool: fetch_url, args: { url: "{{ input.urls.3 }}" }, as: p3 }
    - stream_emit:
        name: crawl_pages
        body:
          page_3: { url: "{{ p3.url }}", title: "{{ p3.title }}", links: "{{ p3.links }}", text: "{{ p3.text }}" }
artifacts:
  produces: [crawl_pages]
resources:
  warm: true
  max_parallel: 4
notes: 多页抓取（流式）：每抓完一页立即 emit 一个 page_* 完整页 chunk，下游可增量消费。
