id: codex-dev
domain: 代码修改
tags: [代码修改, 修复, 重构, 实现]
prior: 3.0
capabilities: []
agent:
  adapter: cli
  models: [gpt-6.1-sol]
  config:
    command:
      - codex
      - exec
      - "-m"
      - gpt-6.1-sol
      - "-s"
      - workspace-write
      - "--skip-git-repo-check"
      - "-C"
      - "C:/Users/DW/repos/capgate"
      - "-"
    timeout_s: 1200
    cwd: "C:/Users/DW/repos/capgate"
artifacts:
  produces: [codex_change]
notes: 用 Codex CLI 的 6.1-sol 改代码。沙箱是 workspace-write，不联网；不 commit、不 push。
