id: chain-watch
domain: 演示
tags: [演示链, 演示余额]
prior: 2.0
capabilities:
  - id: sdk-chain
    kind: sdk
    version: "*"
    shared: true
agent:
  adapter: scripted
  models: [rule-v1]
  recipe:
    - { capability: sdk-chain, tool: address_balance, args: { address: "{{ input.address }}" }, as: bal }
    - emit:
        name: chain_balance
        body: "{{ bal }}"
artifacts:
  produces: [chain_balance]
notes: 演示桩：确定性伪余额，**不是真实链上查询**。真实链上能力见 bca-chain / bca-evm。
