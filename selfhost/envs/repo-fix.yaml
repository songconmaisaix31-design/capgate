id: repo-fix
domain: 自举构建
tags: [修复, 写入, write, fix, 改代码]
prior: 1.0
capabilities:
  - id: mcp-repo
    kind: mcp
    version: "*"
    shared: true
agent:
  adapter: scripted
  models: [rule-v1]
  recipe:
    - capability: mcp-repo
      tool: write_file
      args:
        path: "{{ input.path }}"
        content: "{{ input.content }}"
        allow_write: "{{ input.allow_write }}"
        reason: "{{ task.goal }}"
      as: patch
    - emit:
        name: patch
        body: "{{ patch }}"
artifacts:
  produces: [patch]
resources:
  warm: false
notes: 受限写入（issue #014）。默认 dry-run；正式写入除 allow_write=true 外，还要求进程启动时通过 CAPGATE_SELFHOST_APPROVED_PATCH 收到匹配的已审 patch 产物。没有任务卡，需显式给 path/content/allow_write 输入。
