name: readme-demo

on:
  push:
    branches: [master]
    paths:
      - "capgate/**"
      - "selfhost/**"
      - "tools/make-demo.mjs"
  schedule:
    - cron: "0 3 * * 1" # 每周一，防止动效悄悄过期
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Render demo svg from real output
        run: node tools/make-demo.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/demo/demo.svg; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/demo/demo.svg
          git commit -m "chore(readme): 用真实输出重新生成演示动效"
          git push
