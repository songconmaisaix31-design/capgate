name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        mcp-extra: ["mcp", "mcp-v2"]
    env:
      CAPGATE_MCP_SDK: ${{ matrix.mcp-extra == 'mcp' && '1' || '2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,${{ matrix.mcp-extra }}]"
      - name: pytest
        run: python -m pytest -q
      - name: end-to-end demo
        run: python -m capgate demo -s all
      - name: selfhost quality gate
        run: python -m selfhost.loop --only T03
