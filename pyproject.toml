[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capgate"
version = "0.1.0"
description = "本地能力网关：控制面 / 能力池 / 领域环境 / 任务编排"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "mcp>=1.2,<2",  # 本仓库基于 1.x 的 ClientSession / FastMCP 接口；2.x 是重写，需另写 adapter
    "packaging>=23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
capgate = "capgate.cli:main"

[tool.setuptools.packages.find]
include = ["capgate*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
