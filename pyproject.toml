[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capgate"
version = "0.1.0"
description = "本地能力网关：控制面 / 能力池 / 领域环境 / 任务编排"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "mcp>=1.2,<2",  # 本仓库基于 1.x 的 ClientSession / FastMCP 接口；2.x 是重写，需另写 adapter
    "packaging>=23",
    "filelock>=3.12",  # 账本跨进程写锁（本机单写者）
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff==0.15.20"]

[project.scripts]
capgate = "capgate.cli:main"

[tool.setuptools.packages.find]
include = ["capgate*"]

[tool.setuptools.package-data]
capgate = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["integration: 需要本机真实 MCP（BCA / FIT），缺依赖时自动跳过"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["capgate", "tests"]
extend-exclude = ["var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
# RUF001-003 把中文全角标点当"易混淆字符"，对中文代码库是纯噪声
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# typer 的选项声明就是"默认参数里调函数"
"capgate/cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["capgate"]

[tool.ruff.format]
quote-style = "double"

